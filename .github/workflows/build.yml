name: Build & Publish Gentoo Binary Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to build'
        required: false
        default: 'app-editors/neovim'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: gentoo/stage3:amd64-openrc
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          rm -rf /usr/local/lib/android || true
          rm -rf /usr/share/dotnet || true

      - name: Configure Gentoo Portage & Pure 64-bit ABI
        run: |
          mkdir -p /etc/portage/make.conf.d /etc/portage/package.use

          cat << 'EOF' > /etc/portage/make.conf
          CFLAGS="-O2 -pipe -march=core2 -mtune=core2"
          CXXFLAGS="${CFLAGS}"
          CPU_FLAGS_X86="mmx mmxext sse sse2 sse3 ssse3"

          VIDEO_CARDS="intel i965"
          INPUT_DEVICES="libinput synaptics keyboard mouse"

          FEATURES="binpkg-multi-instance buildpkg parallel-fetch"
          PKGDIR="/var/cache/binpkgs"
          EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=4.0 --verbose --update --newuse --deep"

          ACCEPT_KEYWORDS="amd64"
          ACCEPT_LICENSE="*"
          
          # Pure 64-bit ABI configuration to eliminate multilib/32-bit slot conflicts
          ABI_X86="64"
          USE="X xorg alsa pulseaudio opengl vaapi dracut harfbuzz -systemd -kde -gnome -32bit"
          EOF

          echo "sys-kernel/installkernel dracut" > /etc/portage/package.use/installkernel
          echo "media-libs/freetype harfbuzz png X" > /etc/portage/package.use/freetype
          echo "x11-libs/pango -introspection" > /etc/portage/package.use/pango

      - name: Sync Portage Tree
        run: emerge-webrsync

      - name: Build Target Packages
        run: |
          BASE_PACKAGES="sys-kernel/gentoo-kernel-bin sys-boot/grub net-misc/dhcpcd app-admin/sudo net-wireless/wpa_supplicant net-wireless/iw"
          EXTRA_PACKAGES="${{ github.event.inputs.packages }}"
          TARGETS="@system $BASE_PACKAGES $EXTRA_PACKAGES"

          emerge --buildpkg --deep --newuse $TARGETS

      - name: Generate Binhost Index
        run: emaint binhost --fix

      - name: Compress Binhost Directory
        run: |
          cd /var/cache
          tar -cvJf binpkgs.tar.xz binpkgs/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: binhost
          name: "Gentoo Binhost Store"
          body: "Automated binary package build for Intel GMA 4500 (Core 2 Duo / Penryn)."
          files: /var/cache/binpkgs.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VIDEO_CARDS="intel i965"
          INPUT_DEVICES="libinput synaptics keyboard mouse"

          FEATURES="binpkg-multi-instance buildpkg parallel-fetch"
          PKGDIR="/var/cache/binpkgs"
          EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=4.0 --verbose"

          ACCEPT_KEYWORDS="amd64"
          ACCEPT_LICENSE="*"
          USE="X xorg alsa pulseaudio opengl vaapi dracut -systemd -kde -gnome"
          EOF

          # Required USE flag for gentoo-kernel-bin initramfs generation
          echo "sys-kernel/installkernel dracut" > /etc/portage/package.use/installkernel

      - name: Sync Portage Tree
        run: emerge-webrsync

      - name: Cache Binary Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/binpkgs
          key: binpkgs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            binpkgs-${{ runner.os }}-

      - name: Build Packages & Dependencies
        run: |
          # Base target set for initial boot environment
          BASE_PACKAGES="sys-kernel/gentoo-kernel-bin sys-boot/grub net-misc/dhcpcd app-admin/sudo"
          
          EXTRA_PACKAGES="${{ github.event.inputs.packages }}"
          TARGETS="@system $BASE_PACKAGES $EXTRA_PACKAGES"

          # --buildpkg merges dependencies into the runner while populating /var/cache/binpkgs
          emerge --buildpkg --deep --newuse $TARGETS

      - name: Generate Binhost Index
        run: emaint binhost --fix

      - name: Upload Binary Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gentoo-binpkgs
          path: /var/cache/binpkgs/
          retention-days: 7

name: Build & Publish Gentoo Binary Packages to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to build'
        required: false
        default: 'app-editors/neovim'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:amd64-openrc
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          rm -rf /usr/local/lib/android || true
          rm -rf /usr/share/dotnet || true

      - name: Configure Gentoo Portage & Pure 64-bit ABI
        run: |
          mkdir -p /etc/portage/make.conf.d /etc/portage/package.use

          cat << 'EOF' > /etc/portage/make.conf
          CFLAGS="-O2 -pipe -march=core2 -mtune=core2"
          CXXFLAGS="${CFLAGS}"
          CPU_FLAGS_X86="mmx mmxext sse sse2 sse3 ssse3"

          VIDEO_CARDS="intel i965"
          INPUT_DEVICES="libinput synaptics keyboard mouse"

          FEATURES="binpkg-multi-instance buildpkg parallel-fetch"
          PKGDIR="/var/cache/binpkgs"
          EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=4.0 --verbose --update --newuse --deep"

          ACCEPT_KEYWORDS="amd64"
          ACCEPT_LICENSE="*"
          
          # Pure 64-bit ABI configuration to eliminate multilib/32-bit slot conflicts
          ABI_X86="64"
          USE="X xorg alsa pulseaudio opengl vaapi dracut harfbuzz -systemd -kde -gnome -32bit"
          EOF

          echo "sys-kernel/installkernel dracut" > /etc/portage/package.use/installkernel
          echo "media-libs/freetype harfbuzz png X" > /etc/portage/package.use/freetype
          echo "x11-libs/pango -introspection" > /etc/portage/package.use/pango

      - name: Sync Portage Tree
        run: emerge-webrsync

      - name: Build Target Packages
        run: |
          BASE_PACKAGES="sys-kernel/gentoo-kernel-bin sys-boot/grub net-misc/dhcpcd app-admin/sudo net-wireless/wpa_supplicant net-wireless/iw"
          EXTRA_PACKAGES="${{ github.event.inputs.packages }}"
          TARGETS="@system $BASE_PACKAGES $EXTRA_PACKAGES"

          emerge --buildpkg --deep --newuse $TARGETS

      - name: Generate Binhost Index
        run: emaint binhost --fix

      - name: Deploy Binhost to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /var/cache/binpkgs
          publish_branch: gh-pages
